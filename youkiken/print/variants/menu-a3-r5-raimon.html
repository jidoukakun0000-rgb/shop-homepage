<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>陽気軒 メニュー表 A3（r1 中華ラーメンのマーク入り）</title>
<!--
  陽気軒 紙メニュー改訂 A3版下の叩き台
  - A3横（420×297mm）× 表裏。表＝麺類の部、裏＝ご飯の部（平日・土日祝の計4面）
  - データはこのファイル内に埋め込んだ menu.json（2026-09版）のコピー
  - 塗り足し3mmは業者仕様確定後に付ける（現状は仕上がり寸のみ）
  - あふれ検出：カラムが縦にあふれると赤い「あふれ」タグが付く。未配置カテゴリは上部に赤帯で警告
  出力例: chrome --headless --print-to-pdf=menu-a3-draft.pdf --no-pdf-header-footer menu-a3-draft.html
-->
<style>
  :root {
    --paper: #FCF5E3;
    --paper-deep: #F7E9C8;
    --ink: #3A2410;
    --orange: #E8780A;
    --orange-deep: #C75B00;
    --red: #B5442A;
    --blue: #3F7CB8;
    --brown: #7A4A18;
    --takeout: #C2410C;
    --frame: #8C3A12;
    /* r1案：エンブレム用の深紅×金 */
    --crimson: #9E2208;
    --gold: #C89B3C;
    --gold-lt: #FFE9A8;
    --corner-tl: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2244%22%20height%3D%2244%22%20viewBox%3D%220%200%2044%2044%22%3E%3Cg%20transform%3D%22rotate%280%2022%2022%29%22%3E%3Cpath%20d%3D%22M4%2040%20V4%20H40%20M4%2028%20V16%20H28%20M16%204%20H28%20M16%2016%20H16%22%20fill%3D%22none%22%20stroke%3D%22%23B8862B%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22square%22%2F%3E%3Cpath%20d%3D%22M10%2034%20V10%20H34%22%20fill%3D%22none%22%20stroke%3D%22%238C3A12%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22square%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    --corner-tr: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2244%22%20height%3D%2244%22%20viewBox%3D%220%200%2044%2044%22%3E%3Cg%20transform%3D%22rotate%2890%2022%2022%29%22%3E%3Cpath%20d%3D%22M4%2040%20V4%20H40%20M4%2028%20V16%20H28%20M16%204%20H28%20M16%2016%20H16%22%20fill%3D%22none%22%20stroke%3D%22%23B8862B%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22square%22%2F%3E%3Cpath%20d%3D%22M10%2034%20V10%20H34%22%20fill%3D%22none%22%20stroke%3D%22%238C3A12%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22square%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    --corner-br: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2244%22%20height%3D%2244%22%20viewBox%3D%220%200%2044%2044%22%3E%3Cg%20transform%3D%22rotate%28180%2022%2022%29%22%3E%3Cpath%20d%3D%22M4%2040%20V4%20H40%20M4%2028%20V16%20H28%20M16%204%20H28%20M16%2016%20H16%22%20fill%3D%22none%22%20stroke%3D%22%23B8862B%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22square%22%2F%3E%3Cpath%20d%3D%22M10%2034%20V10%20H34%22%20fill%3D%22none%22%20stroke%3D%22%238C3A12%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22square%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    --corner-bl: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2244%22%20height%3D%2244%22%20viewBox%3D%220%200%2044%2044%22%3E%3Cg%20transform%3D%22rotate%28270%2022%2022%29%22%3E%3Cpath%20d%3D%22M4%2040%20V4%20H40%20M4%2028%20V16%20H28%20M16%204%20H28%20M16%2016%20H16%22%20fill%3D%22none%22%20stroke%3D%22%23B8862B%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22square%22%2F%3E%3Cpath%20d%3D%22M10%2034%20V10%20H34%22%20fill%3D%22none%22%20stroke%3D%22%238C3A12%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22square%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #888; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @page { size: 420mm 297mm; margin: 0; }

  .page {
    position: relative;
    width: 420mm;
    height: 297mm;
    background: radial-gradient(ellipse 120% 100% at 50% 40%, #FDF8EA 0%, var(--paper) 55%, #F5E6C0 100%);
    overflow: hidden;
    page-break-after: always;
    margin: 0 auto 10px;
  }
  @media print { .page { margin: 0; } }

  /* ── 縁：ラーメン丼マークを一周ぐるりと並べた帯 ─────── */
  /* 縁の雷文：印刷でぼやけないようインラインSVGで直接描く */
  .raimon { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .page-inner {
    position: absolute;
    inset: 13.7mm 15.0mm 12.7mm;
    display: flex;
    flex-direction: column;
  }

  /* ── ヘッダー ─────────────────────────── */
  .head {
    display: flex;
    align-items: stretch;
    gap: 6mm;
    margin-bottom: 4mm;
  }
  .shop {
    display: flex;
    align-items: center;
    gap: 4.5mm;
  }
  /* ── ロゴマーク（中華ラーメンのエンブレム） ───────── */
  .mark-lg {
    width: 28mm;
    height: 28mm;
    flex: none;
    filter: drop-shadow(0.7mm 0.8mm 0 rgba(90, 30, 5, 0.32));
  }
  .mark-sm {
    width: 8mm;
    height: 8mm;
    flex: none;
    display: block;
  }
  .shop-text { display: flex; flex-direction: column; }
  .hanko {
    width: 16mm;
    height: 18mm;
    background: linear-gradient(160deg, #D3301A, #9E1808);
    color: #fff;
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 9pt;
    font-weight: 700;
    writing-mode: vertical-rl;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 1.5mm;
    box-shadow: 0.6mm 0.6mm 0 rgba(90, 30, 5, 0.3);
  }
  /* 店名は金の袋文字（paint-order で塗りの下に金の縁を敷く） */
  .shop-name {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 50pt;
    font-weight: 800;
    letter-spacing: 0.07em;
    line-height: 1.02;
    color: var(--crimson);
    white-space: nowrap;
    /* 金の袋文字は依頼主の指示でやめ、深紅一色＋影のみにした（2026-09-10） */
    text-shadow: 0.6mm 0.7mm 0 rgba(90, 30, 5, 0.25);
  }
  .shop-tagline {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 11pt;
    font-weight: 700;
    letter-spacing: 0.34em;
    color: #7A4A18;
    white-space: nowrap;
    margin-top: 0.8mm;
    padding-left: 0.6mm;
  }
  .shop-tagline i { font-style: normal; color: var(--crimson); }
  .shop-sub {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 12pt;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: #6B3A16;
    writing-mode: vertical-rl;
  }
  .face-title {
    align-self: center;
    background: linear-gradient(180deg, #C13A1E, #8C1E08);
    color: #fff;
    font-size: 27pt;
    font-weight: 800;
    letter-spacing: 0.3em;
    padding: 3mm 10mm 3mm 12mm;
    border-radius: 2mm 8mm 8mm 2mm;
    white-space: nowrap;
    border: 0.5mm solid var(--gold);
    box-shadow: 0.7mm 0.7mm 0 rgba(90, 30, 5, 0.35), inset 0 0 0 0.35mm rgba(255, 233, 168, 0.45);
    text-shadow: 0.4mm 0.4mm 0 rgba(70, 15, 0, 0.5);
  }
  .day-tag {
    align-self: center;
    background: linear-gradient(180deg, #F0A21E, #D97B06);
    color: #fff;
    font-size: 16pt;
    font-weight: 800;
    letter-spacing: 0.2em;
    padding: 2.3mm 6mm;
    border-radius: 99mm;
    white-space: nowrap;
    border: 0.45mm solid var(--gold-lt);
    box-shadow: 0.7mm 0.7mm 0 rgba(90, 30, 5, 0.3);
    text-shadow: 0.35mm 0.35mm 0 rgba(90, 30, 5, 0.45);
  }
  .head-spacer { flex: 1; }

  /* InstagramのQRとホームページのURL（ヘッダー右、テイクアウト枠の左隣。4面とも同じ位置）。
     QRは手に持って読める24mm角。白地に黒で、QR自身に周囲4マスの白い余白を含む */
  .connect { align-self: center; display: flex; align-items: center; gap: 3mm; }
  .connect .qr {
    display: block;
    flex: none;
    width: 24mm;
    height: 24mm;
    border: 0.5mm solid var(--brown);
    border-radius: 1.5mm;
    box-shadow: 0.6mm 0.6mm 0 rgba(110, 50, 10, 0.16);
  }
  .connect-text { display: flex; flex-direction: column; gap: 2.2mm; }
  .connect-row { display: flex; flex-direction: column; line-height: 1.15; }
  .connect-lbl { font-size: 9pt; font-weight: 700; color: var(--brown); letter-spacing: 0.04em; }
  .connect-lbl .ig-icon { width: 4.4mm; height: 4.4mm; vertical-align: -1mm; margin-right: 1.2mm; }
  .connect-row b { font-size: 13pt; font-weight: 800; color: var(--ink); letter-spacing: 0.02em; white-space: nowrap; }

  /* 両面刷りの案内（うら面に何の部があるか）。面タイトルの直下に縦積み。
     横並びにすると凡例の幅を圧迫して※行が折り返すため、この形にした */
  .face-col {
    align-self: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.6mm;
  }
  .ura-note {
    background: #fff;
    color: var(--ink);
    font-size: 10.5pt;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 1.6mm 4mm;
    border: 0.5mm solid var(--brown);
    border-radius: 99mm;
    white-space: nowrap;
    box-shadow: 0.6mm 0.6mm 0 rgba(110, 50, 10, 0.16);
  }
  .ura-note b { color: var(--crimson); }

  /* ── 凡例（各ページ右上） ─────────────────── */
  .legend {
    border: 0.6mm solid var(--brown);
    border-radius: 2mm;
    background: #fff;
    padding: 2.5mm 4mm;
    font-size: 9pt;
    line-height: 1.55;
    max-width: 150mm;
    box-shadow: inset 0 0 0 0.35mm rgba(200, 155, 60, 0.55), 0.6mm 0.6mm 0 rgba(110, 50, 10, 0.16);
  }
  .legend-title {
    font-weight: 800;
    font-size: 9.5pt;
    letter-spacing: 0.12em;
    color: var(--crimson);
    margin-bottom: 1mm;
    border-bottom: 0.35mm solid var(--gold);
    padding-bottom: 0.5mm;
  }
  .legend .row-note { color: var(--ink); font-size: 10pt; font-weight: 700; margin-top: 0.8mm; }
  /* 品名横のマークは廃止し、持ち帰りの条件は右上の枠に太字の文章で書く。枠は見出しの高さまで伸びるので中身を縦中央に */
  .legend { display: flex; flex-direction: column; justify-content: center; }
  .legend-main { font-size: 14pt; font-weight: 800; letter-spacing: 0.04em; }

  /* ── バッジ（v2仕様：塗り＝注文オプション、枠＝おすすめ） ── */
  .badge {
    display: inline-block;
    font-size: 8pt;
    font-weight: 700;
    line-height: 1;
    padding: 1.1mm 1.6mm;
    border-radius: 1.2mm;
    vertical-align: 0.2mm;
    white-space: nowrap;
  }
  .badge-ninki { border: 0.5mm solid var(--red); color: var(--red); background: #fff; }
  .badge-meibutsu { border: 0.5mm solid var(--orange-deep); color: var(--orange-deep); background: #fff; }
  /* 1文字バッジ「特」「持」（行内で潰れないサイズ。意味は右上凡例で説明） */
  .kbadge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 5mm;
    height: 5mm;
    border-radius: 1.1mm;
    color: #fff;
    font-size: 10.5pt;
    font-weight: 800;
    line-height: 1;
    vertical-align: -1.2mm;
  }
  .kbadge-toku { background: var(--brown); }
  .kbadge-mochi { background: var(--takeout); }
  .legend .kbadge { width: 6.5mm; height: 6.5mm; font-size: 13pt; vertical-align: -1.8mm; }

  /* ── 本体：4カラム ───────────────────── */
  .cols {
    flex: 1;
    display: flex;
    gap: 6mm;
    min-height: 0;
  }
  .col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 3.6mm;
    overflow: hidden;
    position: relative;
  }

  /* カテゴリブロック */
  .cat { break-inside: avoid; box-shadow: 0.7mm 0.7mm 0 rgba(140, 60, 20, 0.16); border-radius: 1.5mm 9mm 1.5mm 1.5mm; }
  .cat-head {
    color: #fff;
    font-size: 16pt;
    font-weight: 800;
    letter-spacing: 0.18em;
    padding: 1.6mm 5mm 1.6mm 3.2mm;
    border-radius: 1.5mm 9mm 0 0;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 2.6mm;
    border-bottom: 0.55mm solid var(--gold);
    text-shadow: 0.4mm 0.4mm 0 rgba(60, 15, 0, 0.42);
  }
  /* 見出し頭の金の菱形 */
  .cat-head::before {
    content: '';
    flex: none;
    align-self: center;
    width: 2.4mm;
    height: 2.4mm;
    background: var(--gold-lt);
    transform: rotate(45deg);
    box-shadow: 0.25mm 0.25mm 0 rgba(60, 15, 0, 0.3);
  }
  .cat-head .cat-nm { white-space: nowrap; letter-spacing: 0.1em; }
  .cat-head small { font-size: 9pt; font-weight: 600; letter-spacing: 0.05em; line-height: 1.35; text-shadow: none; color: var(--gold-lt); }
  .cat-body {
    border: 0.4mm solid rgba(180, 130, 55, 0.6);
    border-top: none;
    border-radius: 0 0 1.5mm 1.5mm;
    background: #FFFDF4;
    padding: 1.6mm 3mm 2mm;
  }
  .item {
    display: flex;
    align-items: baseline;
    gap: 1.5mm;
    padding: 1.15mm 0;
    font-size: 12.5pt;
    font-weight: 600;
  }
  /* 品名は左寄せ・素直な字間（均等割り付けは判読性を損なうため不採用） */
  .item .nm {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.01em;
  }
  .item .nm .paren { font-size: 8.5pt; }
  .item .dots {
    flex: 1;
    border-bottom: 0.3mm dotted rgba(58, 36, 16, 0.4);
    transform: translateY(-1mm);
    min-width: 2mm; /* 4mm だと「（ジョッキ）」付きの品名が2〜4px足りず「…」で切れる（2026-09-14） */
  }
  .item .pr {
    font-weight: 800;
    font-size: 13pt;
    color: var(--crimson);
    white-space: nowrap;
    font-feature-settings: "tnum";
    min-width: 13.5mm;
    text-align: right;
    letter-spacing: 0.01em;
  }
  .item .pr small { font-size: 8.5pt; font-weight: 600; color: var(--ink); }

  /* ── 余白対処（2026-09-11・案B採用）：空きの大きい3面だけ本文を広げて紙面を使い切る ──
     面ごとの調整は PAGES の tune 指定で .page にクラスが付く。平日ご飯面は元々詰まっているので無指定。
     tune-men＝麺類2面（品名13pt・行間1.5）。13.5ptはトッピングの長い品名が「…」で切れるため不可
     （品名12pt以上・省略なし、を両立できる上限が13pt）
     tune-gohan＝土日祝ご飯面（品数が少ないぶん行間1.65でさらに広げる。品名は12.5ptのまま） */
  .page.tune-men .item { font-size: 13pt; line-height: 1.5; padding: 2.6mm 0; }
  .page.tune-men .item .pr { font-size: 14pt; }
  .page.tune-men .col { gap: 7mm; }
  .page.tune-men .cat-body { padding: 2mm 3mm 2.4mm; }
  .page.tune-gohan .item { font-size: 12.5pt; line-height: 1.65; padding: 2.9mm 0; }
  .page.tune-gohan .item .pr { font-size: 13.5pt; }
  .page.tune-gohan .col { gap: 8.5mm; }
  .page.tune-gohan .cat-body { padding: 2mm 3mm 2.4mm; }

  /* まんぷく定食枠のキャラクター（旧メニューにいた満腹の男の子・2026-09-11復活。
     元画像とフル解像度の切り抜きは reference/manpuku-boy.png） */
  .feature.has-chara .feature-desc { padding-right: 28mm; min-height: 13mm; }
  .feature-chara { position: absolute; right: 1mm; bottom: 1mm; width: 29mm; }

  /* カテゴリ色帯（現行メニューの色分けを踏襲・縦グラデで艶感） */
  .band-shoyu   { background: linear-gradient(180deg, #F5941E, #C75B00); }
  .band-miso    { background: linear-gradient(180deg, #D4553A, #9E2312); }
  .band-shio    { background: linear-gradient(180deg, #5B93C9, #2A5F98); }
  .band-yakisoba{ background: linear-gradient(180deg, #C09A38, #8C6A1D); }
  .band-rice    { background: linear-gradient(180deg, #DC6828, #A93B1C); }
  .band-drink   { background: linear-gradient(180deg, #8A6B4A, #55422E); }

  /* ── おすすめ・セットの特設枠 ───────────── */
  .feature {
    position: relative;
    border: 1.1mm solid #C13A1E;
    border-radius: 2.5mm;
    background: linear-gradient(180deg, #FFFDF4, #FFF3D8);
    padding: 3mm;
    break-inside: avoid;
    box-shadow: 0.7mm 0.7mm 0 rgba(110, 50, 10, 0.25);
  }
  .feature.orange { border-color: var(--orange-deep); }
  .feature-label {
    display: inline-block;
    background: linear-gradient(180deg, #D3301A, #9E1808);
    color: #fff;
    font-size: 10pt;
    font-weight: 800;
    letter-spacing: 0.15em;
    padding: 1.2mm 3.5mm;
    border-radius: 99mm;
    margin-bottom: 1.5mm;
    text-shadow: 0.35mm 0.35mm 0 rgba(0, 0, 0, 0.3);
  }
  .feature.orange .feature-label { background: linear-gradient(180deg, #E8780A, #B5570A); }
  .feature.orange { box-shadow: 0.7mm 0.7mm 0 rgba(110, 50, 10, 0.25), inset 0 0 0 0.35mm rgba(200, 155, 60, 0.75); }
  .feature { box-shadow: 0.7mm 0.7mm 0 rgba(110, 50, 10, 0.25), inset 0 0 0 0.35mm rgba(200, 155, 60, 0.75); }
  .feature-label {
    border: 0.35mm solid var(--gold-lt);
  }
  .feature-name { font-size: 17.5pt; font-weight: 800; color: #5E2A0C; }
  .feature-name .pr {
    color: var(--crimson);
    margin-left: 3mm;
    font-size: 20pt;
    -webkit-text-stroke: 0.5mm rgba(200, 155, 60, 0.9);
    paint-order: stroke fill;
  }
  .feature-desc { font-size: 9pt; font-weight: 600; margin-top: 1.2mm; line-height: 1.5; color: #5E3A18; }
  /* セット枠：赤丸「得」付き */
  .setbox {
    position: relative;
    border: 0.8mm solid var(--orange-deep);
    border-radius: 2.5mm;
    background: linear-gradient(180deg, #FFFDF4, #FFF0CE);
    padding: 2.4mm;
    box-shadow: 0.7mm 0.7mm 0 rgba(110, 50, 10, 0.25);
  }
  .toku-circle {
    position: absolute;
    top: -3.5mm;
    left: -3.5mm;
    width: 11mm;
    height: 11mm;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #E8503A, #A50F02);
    color: #FFE9A8;
    /* 漢字は行ボックス内で上に寄って見えるので、少し下げて光学中央に座らせる */
    font-size: 14pt;
    font-weight: 800;

const svgUri = (svg) => 'data:image/svg+xml,' + encodeURIComponent(svg);
/* 品名横のマークは廃止（「特」2026-09-13、「持」2026-09-14）。持ち帰りの条件は右上の枠に文章で書く。
   SAMPLE_TAGS のデータは残っているが描画されない */
const BADGE_IMG = {};

function tagBadges(tags) {
  if (!tags || !tags.length) return '';
  const map = {
    '持ち帰り可': BADGE_IMG['持帰'],
    '持帰': BADGE_IMG['持帰'],
  };
  // 並び順ルール：名物/人気 → 特盛可 → 持帰
  const order = ['名物', '人気', '特盛可', '持ち帰り可', '持帰'];
  return [...tags].sort((a, b) => order.indexOf(a) - order.indexOf(b)).map((t) => map[t] || '').join('');
}

function itemRow(it) {
  const tags = [...(it.tags || []), ...(SAMPLE_TAGS[it.name] || [])];
  return `<div class="item"><span class="nm">${nameHtml(it.name)}</span>${tagBadges(tags)}<span class="dots"></span><span class="pr">${yen(it.price)}</span></div>`;
}

function catBlock(cat, omit) {
  const items = cat.items.filter((it) => !omit.has(it.name));
  if (!items.length) return '';
  const note = cat.note ? `<small>${esc(cat.note)}</small>` : '';
  return `<section class="cat">
    <div class="cat-head ${bandOf(cat.name)}"><span class="cat-nm">${esc(catDisplayName(cat.name))}</span>${note}</div>
    <div class="cat-body">${items.map(itemRow).join('')}</div>
  </section>`;
}

function featureBlock(key, day) {
  const f = FEATURES[key];
  const item = findItem(day, key);
  if (!item) return '';
  const name = f.rename || item.name;
  const tags = [...(SAMPLE_TAGS[key] || [])];
  const labelHtml = f.label ? `<span class="feature-label">${esc(f.label)}</span>` : '';
  const charaHtml = f.chara ? `<img class="feature-chara" src="${CHARA}" alt="">` : '';
  return `<section class="feature ${f.cls}${f.chara ? ' has-chara' : ''}">
    ${labelHtml}${charaHtml}
    <div class="feature-name">${esc(name)}<span class="pr">${yen(item.price)}</span>　${tagBadges(tags)}</div>
    <div class="feature-desc">${esc(f.desc)}</div>
  </section>`;
}

function setBlock() {
  const s = MENU.setInfo;
  const optList = (opts) => opts.map((o) => {
    const m = o.match(/^(.*?セット)：(.*)$/);
    return m ? `<li><b>${esc(m[1])}</b>　${esc(m[2])}</li>` : `<li>${esc(o)}</li>`;
  }).join('');
  /* 枠は1つのまま、価格帯ごとに段を分ける（A〜C＝＋350円／D・E＝＋450円） */
  const tiers = s.tiers.map((t) => `<div class="setbox-tier">
      <div class="setbox-plus">プラス <svg class="setnum" role="img" aria-label="${t.price}"><text class="outer">${t.price}</text><text class="inner">${t.price}</text></svg> 円</div>
      <ul>${optList(t.options)}</ul>
    </div>`).join('');
  return `<section class="setbox">
    <div class="toku-circle">得</div>
    <div class="setbox-title">ラーメンセット</div>
    <div class="setbox-lead">お好きな麺類に</div>
    ${tiers}
    <div class="note">${esc(s.note)}</div>
  </section>`;
}

/* セット価格のSVG数字を文字の実寸に合わせる（SVGは中身に合わせて自動では広がらないため） */
function fitSetNumbers() {
  const PAD = 4; // 外側の赤線の半分（1.3mm÷2≒2.5px）より少し広く取る
  document.querySelectorAll('svg.setnum').forEach((svg) => {
    const box = svg.querySelector('text.inner').getBBox();
    const w = box.width + PAD * 2, h = box.height + PAD * 2;
    svg.setAttribute('viewBox', `${box.x - PAD} ${box.y - PAD} ${w} ${h}`);
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    // インラインのSVGは下端が行の基準線に乗るので、文字の基準線（y=0）が周りの文字と揃うよう下げる
    svg.style.verticalAlign = `${-(box.y + box.height + PAD)}px`;
    svg.style.margin = `0 ${-PAD}px`;
  });
}

function legendBlock(day) {
  /* 大盛り条件は面の日だけを書く。平日シートに土日祝価格（またはその逆）を
     併記していたのをやめた（両面とも日別シートなので不要・誤読のもと。2026-09-11） */
  const oomori = day === 'weekday'
    ? '麺類大盛りは無料です／ご飯類大盛り＋200円'
    : '大盛り：麺類・ご飯類 各＋200円';
  return `<div class="legend">
    <div class="legend-main">汁物以外はテイクアウトできます</div>
    <div class="row-note">※${oomori}</div>
  </div>`;
}

function specialBlock(token, day) {
  if (token === '@set') return setBlock();
  if (token === '@oomori-men') {
    /* シートは日別なので、他日の言及は一切載せない（依頼主指示 2026-09-12〜13） */
    const t = day === 'weekday'
      ? '麺類 <span class="big">大盛り無料</span>！'
      : '麺類大盛り <span class="big">＋200円</span>';
    return `<section class="banner-oomori">${t}</section>`;
  }
  if (token === '@oomori-gohan') {
    return `<section class="infobox">ご飯類の大盛りは<b>＋200円</b>にて承ります。</section>`;
  }
  if (token === '@teishoku-oomori') {
    /* 定食枠の直下に置く注記（依頼主指示 2026-09-12） */
    return `<section class="infobox">定食のみ、<b>ご飯大盛り無料</b>です。</section>`;
  }
  if (token === '@weekend-note') {
    return `<section class="infobox">${esc(MENU.days.weekend.note || '')}</section>`;
  }
  if (token.startsWith('@feature:')) return featureBlock(token.slice(9), day);
  /* @solo:品名 または @solo:品名|表示名 … 一覧から抜いて単独の枠に出す
     （半ねぎラーメン・ラーメン替え玉用。表示名はメニュー表だけの言い換えで、データ名は menu.json 準拠のまま） */
  if (token.startsWith('@solo:')) {
    const [key, disp] = token.slice(6).split('|');
    const item = findItem(day, key);
    if (!item) return '';
    return `<section class="solo-box">${itemRow(disp ? { ...item, name: disp } : item)}</section>`;
  }
  return '';
}

function findItem(day, name) {
  for (const cat of MENU.days[day].categories) {
    const hit = cat.items.find((it) => it.name === name);
    if (hit) return hit;
  }
  return null;
}

function omitSetFor(page) {
  const omit = new Set();
  for (const col of page.cols) for (const token of col) {
    if (token.startsWith('@feature:')) {
      const key = token.slice(9);
      omit.add(key);
      (FEATURES[key]?.omitAlso || []).forEach((n) => omit.add(n));
    } else if (token.startsWith('@solo:')) {
      omit.add(token.slice(6).split('|')[0]);
    }
  }
  return omit;
}

function renderPage(page, qaMessages) {
  const dayLabel = MENU.days[page.day].label;
  const omit = omitSetFor(page);
  const catsByName = Object.fromEntries(MENU.days[page.day].categories.map((c) => [c.name, c]));

  const colsHtml = page.cols.map((col) => {
    const blocks = col.map((token) => {
      if (token.startsWith('@')) return specialBlock(token, page.day);
      const cat = catsByName[token];
      if (!cat) { qaMessages.push(`【${dayLabel}・${page.face}】カテゴリ「${token}」がmenu.jsonに見つかりません`); return ''; }
      return catBlock(cat, omit);
    }).join('');
    return `<div class="col">${blocks}</div>`;

/* ============================================================
   QAチェック：未配置カテゴリ・カラムあふれの検出
   ============================================================ */
function qaUnplacedCategories(qaMessages) {
  for (const dayKey of ['weekday', 'weekend']) {
    const placed = new Set();
    const featured = new Set();
    PAGES.filter((p) => p.day === dayKey).forEach((p) => p.cols.flat().forEach((t) => {
      if (t.startsWith('@feature:')) {
        const key = t.slice(9);
        featured.add(key);
        (FEATURES[key]?.omitAlso || []).forEach((n) => featured.add(n));
      } else if (!t.startsWith('@')) {
        placed.add(t);
      }
    }));
    for (const cat of MENU.days[dayKey].categories) {
      if (placed.has(cat.name)) continue;
      // 全品が特設枠（＋説明内掲載）でカバーされていれば配置済み扱い
      if (cat.items.every((it) => featured.has(it.name))) continue;
      qaMessages.push(`【${MENU.days[dayKey].label}】カテゴリ「${cat.name}」（${cat.items.length}品）がどの面にも配置されていません`);
    }
  }
}

function qaOverflow() {
  document.querySelectorAll('.page').forEach((pageEl) => {
    pageEl.querySelectorAll('.col').forEach((colEl, i) => {
      if (colEl.scrollHeight > colEl.clientHeight + 1) {
        const tag = document.createElement('div');
        tag.className = 'overflow-tag';
        tag.textContent = `あふれ：${colEl.scrollHeight - colEl.clientHeight}px`;
        colEl.appendChild(tag);
        console.error(`[overflow] ${pageEl.dataset.label} 第${i + 1}カラム`);
      }
    });
  });
}

const qaMessages = [];
qaUnplacedCategories(qaMessages);
const html = PAGES.map((p) => renderPage(p, qaMessages)).join('');
const banner = qaMessages.length
  ? `<div class="qa-banner">要修正：${qaMessages.map(esc).join('／')}</div>` : '';
document.getElementById('app').innerHTML = banner + html;
fitSetNumbers();
qaOverflow();
</script>
