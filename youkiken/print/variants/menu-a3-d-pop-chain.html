  - データはこのファイル内に埋め込んだ menu.json（2026-06版）のコピー。確定後に差し替える
  - 塗り足し3mmは業者仕様確定後に付ける（現状は仕上がり寸のみ）
  - あふれ検出：カラムが縦にあふれると赤い「あふれ」タグが付く。未配置カテゴリは上部に赤帯で警告

<style>

     ページ上下に太い赤帯（＋オレンジの細ライン）を通すだけのすっきり構成。

  :root {
    --ink: #231815;
    --red: #D7000F;
    --red-deep: #8E000A;
    --orange: #F08300;
    --orange-deep: #C95F00;
    --brown: #7A4A18;      /* 特盛バッジ指定色 */
    --takeout: #C2410C;    /* 持帰バッジ指定色 */
    --shadow-warm: #F6D3AC; /* ハードシャドウ用の淡オレンジ */
    --leader: #C9B8A6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #888; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @page { size: 420mm 297mm; margin: 0; }

  .page {
    position: relative;
    width: 420mm;
    height: 297mm;
    background: #FFFFFF;
    overflow: hidden;
    page-break-after: always;
    margin: 0 auto 10px;
  }
  @media print { .page { margin: 0; } }

  .page-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  /* ── ページ上下の太い赤帯 ───────────────── */
  .topband {
    height: 8mm;
    background: var(--red);
    border-bottom: 2.5mm solid var(--orange);
  }

  /* ── ヘッダー（白地に大ブロック） ───────────── */
  .head {
    display: flex;
    align-items: center;
    gap: 6mm;
    padding: 3.5mm 10mm 2.5mm;
  }
  .shop { display: flex; align-items: center; }
  .shop-logo {
    background: var(--red);
    border-radius: 2.5mm;
    padding: 1.6mm 4.5mm 2.4mm;
    text-align: center;
    box-shadow: 1.2mm 1.2mm 0 var(--shadow-warm);
  }
  .shop-kicker {
    display: block;
    color: #fff;
    font-size: 8.5pt;
    font-weight: 800;
    letter-spacing: 0.3em;
    margin-bottom: 0.6mm;
  }
  .shop-name {
    display: block;
    color: #fff;
    font-size: 30pt;
    font-weight: 900;
    letter-spacing: 0.14em;
    line-height: 1.05;
    white-space: nowrap;
    -webkit-text-stroke: 1mm var(--red-deep);
    paint-order: stroke fill;
  }
  /* 面タイトル：白袋文字＋赤縁＋オレンジのハードシャドウ */
  .face-title {
    font-size: 40pt;
    font-weight: 900;
    letter-spacing: 0.12em;
    line-height: 1;
    color: #fff;
    -webkit-text-stroke: 2.1mm var(--red);
    paint-order: stroke fill;
    text-shadow: 1.7mm 1.7mm 0 var(--orange);
    white-space: nowrap;
  }
  .day-tag {
    background: var(--orange);
    color: #fff;
    font-size: 17pt;
    font-weight: 900;
    letter-spacing: 0.25em;
    padding: 2.6mm 6mm 2.8mm 7mm;
    border-radius: 2mm;
    white-space: nowrap;
    box-shadow: 1.2mm 1.2mm 0 var(--shadow-warm);
    -webkit-text-stroke: 0.7mm var(--orange-deep);
    paint-order: stroke fill;
  }
  .head-spacer { flex: 1; }

  /* ── 凡例（各ページ右上） ─────────────────── */
  .legend {
    border: 0.7mm solid var(--red);
    border-radius: 2mm;
    background: #fff;
    padding: 2.2mm 4mm;
    font-size: 9pt;
    line-height: 1.55;
    max-width: 155mm;
  }
  .legend-title { font-weight: 800; font-size: 9.5pt; color: var(--red); margin-bottom: 0.8mm; letter-spacing: 0.06em; }
  .legend .row-note { color: var(--ink); }

  /* ── バッジ（塗り＝注文オプション、枠＝おすすめ） ── */
  .badge {
    display: inline-block;
    font-size: 8pt;
    font-weight: 800;
    line-height: 1;
    padding: 1.1mm 1.6mm;
    border-radius: 1.2mm;
    vertical-align: 0.2mm;
    white-space: nowrap;
  }
  .badge-ninki { border: 0.5mm solid var(--red); color: var(--red); background: #fff; }
  .badge-meibutsu { border: 0.5mm solid var(--orange-deep); color: var(--orange-deep); background: #fff; }
  /* 1文字バッジ「特」「持」（5mm角以上・指定色維持） */
  .kbadge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 5mm;
    height: 5mm;
    border-radius: 1.1mm;
    color: #fff;
    font-size: 10.5pt;
    font-weight: 800;
    line-height: 1;
    vertical-align: -1.2mm;
  }
  .kbadge-toku { background: var(--brown); }
  .kbadge-mochi { background: var(--takeout); }
  .legend .kbadge { width: 6.5mm; height: 6.5mm; font-size: 13pt; vertical-align: -1.8mm; }

  /* ── 本体：4カラム ───────────────────── */
  .cols {
    flex: 1;
    display: flex;
    gap: 7mm;
    min-height: 0;
    padding: 2.5mm 10mm 0;
  }
  .col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4mm;
    overflow: hidden;
    position: relative;
  }

  /* カテゴリブロック：左タブ風の特大角丸ブロック見出し＋フレーム無し本文 */
  .cat { break-inside: avoid; }
  .cat-head {
    --hd: var(--red);
    --hd-dark: var(--red-deep);
    background: var(--hd);
    border-left: 4mm solid var(--hd-dark);
    color: #fff;
    font-size: 17pt;
    font-weight: 900;
    letter-spacing: 0.14em;
    padding: 1.8mm 4mm 2.1mm 4mm;
    border-radius: 2.5mm;
    display: flex;
    align-items: baseline;
    gap: 3mm;
    box-shadow: 1.2mm 1.2mm 0 var(--shadow-warm);
  }
  .cat-head .cat-nm {
    white-space: nowrap;
    -webkit-text-stroke: 0.85mm var(--hd-dark);
    paint-order: stroke fill;
  }
  .cat-head small { font-size: 9pt; font-weight: 700; letter-spacing: 0.04em; }
  .cat-body {
    background: #fff;
    padding: 1.7mm 1.5mm 0.4mm 2mm;
  }
  .item {
    display: flex;
    align-items: baseline;
    gap: 1.8mm;
    padding: 0.9mm 0;
    font-size: 11pt;
    font-weight: 700;
  }
  .item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .nm .paren { font-size: 8pt; }
  .item .dots { flex: 1; border-bottom: 0.4mm dotted var(--leader); transform: translateY(-1mm); min-width: 4mm; }
  .item .pr { font-weight: 900; font-size: 13pt; color: var(--red); white-space: nowrap; font-feature-settings: "tnum"; }
  .item .pr small { font-size: 8.5pt; font-weight: 700; color: var(--ink); }

  /* カテゴリ色帯：赤〜オレンジ系の大ブロックに整理 */
  .band-shoyu   { --hd: #D7000F; --hd-dark: #8E000A; }
  .band-miso    { --hd: #A50014; --hd-dark: #6B000D; }
  .band-shio    { --hd: #E06A00; --hd-dark: #9C4A00; }
  .band-yakisoba{ --hd: #C95F00; --hd-dark: #8C4200; }
  .band-rice    { --hd: #E8380D; --hd-dark: #9C2308; }
  .band-drink   { --hd: #963A00; --hd-dark: #5F2500; }

  /* ── おすすめ・セットの特設枠（白地＋太罫のみ） ── */
  .feature {
    border: 1.4mm solid var(--red);
    border-radius: 3mm;
    background: #fff;
    padding: 3mm 3.5mm;
    break-inside: avoid;
    box-shadow: 1.4mm 1.4mm 0 var(--shadow-warm);
  }
  .feature.orange { border-color: var(--orange-deep); }
  .feature-label {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font-size: 10.5pt;
    font-weight: 900;
    letter-spacing: 0.15em;
    padding: 1.2mm 3.5mm;
    border-radius: 1.5mm;
    margin-bottom: 1.5mm;
  }
  .feature.orange .feature-label { background: var(--orange-deep); }
  .feature-name { font-size: 17pt; font-weight: 900; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0.5mm 3mm; }
  .feature-name .pr {
    color: var(--red);
    font-size: 22pt;
    font-weight: 900;
    white-space: nowrap;
    text-shadow: 1mm 1mm 0 var(--shadow-warm);

  .feature-desc { font-size: 9.5pt; font-weight: 600; margin-top: 1.2mm; line-height: 1.5; }

  /* セット枠：赤丸「得」＋袋文字のセット価格 */
  .setbox {
    position: relative;
    border: 1.4mm solid var(--orange-deep);
    border-radius: 3mm;
    background: #fff;
    padding: 3mm;
    box-shadow: 1.4mm 1.4mm 0 var(--shadow-warm);
  }
  .toku-circle {
    position: absolute;
    top: -4.5mm;
    left: -4.5mm;
    width: 14mm;
    height: 14mm;
    border-radius: 50%;
    background: var(--red);
    color: #fff;
    font-size: 15pt;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0.8mm solid #fff;
    box-shadow: 1mm 1mm 0 var(--shadow-warm);
    z-index: 2;
  }
  .setbox-title {
    text-align: center;
    font-size: 17pt;
    font-weight: 900;
    letter-spacing: 0.18em;
    color: #fff;
    background: var(--orange);
    border-radius: 2mm;
    padding: 1.8mm 0 2mm;
    -webkit-text-stroke: 0.85mm var(--orange-deep);
    paint-order: stroke fill;
  }
  .setbox-plus { text-align: center; font-size: 13pt; font-weight: 900; margin: 2.2mm 0 1.6mm; }
  .setbox-plus b {
    font-size: 31pt;
    color: #fff;
    -webkit-text-stroke: 1.5mm var(--red);
    paint-order: stroke fill;
    text-shadow: 1.3mm 1.3mm 0 var(--orange);
  }
  .setbox ul { list-style: none; font-size: 11pt; font-weight: 700; line-height: 1.75; }
  .setbox ul b { color: var(--orange-deep); }
  .setbox .note { font-size: 8pt; margin-top: 1mm; color: #6b4a2a; }

  .infobox {
    border: 0.6mm solid var(--leader);
    border-radius: 2mm;
    background: #FFF6EC;
    padding: 2.5mm 3.5mm;
    font-size: 10pt;
    font-weight: 700;
    line-height: 1.6;
  }
  .infobox b { color: var(--red); }
  .banner-oomori {
    background: var(--red);
    color: #fff;
    text-align: center;
    font-size: 15pt;
    font-weight: 900;
    letter-spacing: 0.08em;
    padding: 2.8mm 2mm;
    border-radius: 2.5mm;
    box-shadow: 1.4mm 1.4mm 0 var(--shadow-warm);
    line-height: 1.45;
  }
  .banner-oomori small { display: block; font-size: 9.5pt; font-weight: 700; letter-spacing: 0.04em; }
  .banner-oomori .big {

    color: #fff;
    -webkit-text-stroke: 1mm var(--red-deep);

  /* ── フッター：ページ下の太い赤帯そのもの ───────── */
  .foot {
    background: var(--red);
    border-top: 2.5mm solid var(--orange);

    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2.6mm 10mm 2.8mm;
    font-size: 11.5pt;
    font-weight: 900;

  .draft-note {
    text-align: right;
    font-size: 6.5pt;
    color: #9a8a7a;
    padding: 0.6mm 10mm 1mm;
  }
  .overflow-tag {
    position: absolute;
    top: 0;
    right: 0;
    background: #D40000;
    color: #fff;
    font-size: 9pt;
    font-weight: 700;
    padding: 1mm 2.5mm;
    border-radius: 1mm;
    z-index: 10;
  }
  .qa-banner {
    background: #D40000;
    color: #fff;
    font-size: 10pt;
    font-weight: 700;
    padding: 2mm 4mm;
    margin-bottom: 2mm;
    border-radius: 1mm;
  }
</style>

const svgUri = (svg) => 'data:image/svg+xml,' + encodeURIComponent(svg);
const BADGE_IMG = {
  '持帰': '<span class="kbadge kbadge-mochi">持</span>',
  '特盛可': '<span class="kbadge kbadge-toku">特</span>',
};

function tagBadges(tags) {
  if (!tags || !tags.length) return '';
  const map = {
    '人気': '<span class="badge badge-ninki">人気</span>',
    '名物': '<span class="badge badge-meibutsu">名物</span>',
    '特盛可': BADGE_IMG['特盛可'],
    '持ち帰り可': BADGE_IMG['持帰'],
    '持帰': BADGE_IMG['持帰'],
  };
  // 並び順ルール：名物/人気 → 特盛可 → 持帰
  const order = ['名物', '人気', '特盛可', '持ち帰り可', '持帰'];
  return [...tags].sort((a, b) => order.indexOf(a) - order.indexOf(b)).map((t) => map[t] || '').join('');
}

function itemRow(it) {
  const tags = [...(it.tags || []), ...(SAMPLE_TAGS[it.name] || [])];
  return `<div class="item"><span class="nm">${nameHtml(it.name)}</span>${tagBadges(tags)}<span class="dots"></span><span class="pr">${yen(it.price)}</span></div>`;
}

function catBlock(cat, omit) {
  const items = cat.items.filter((it) => !omit.has(it.name));
  if (!items.length) return '';
  const note = cat.note ? `<small>${esc(cat.note)}</small>` : '';
  return `<section class="cat">
    <div class="cat-head ${bandOf(cat.name)}"><span class="cat-nm">${esc(cat.name)}</span>${note}</div>
    <div class="cat-body">${items.map(itemRow).join('')}</div>
  </section>`;
}

function featureBlock(key, day) {
  const f = FEATURES[key];
  const item = findItem(day, key);
  if (!item) return '';
  const name = f.rename || item.name;
  const tags = [...(SAMPLE_TAGS[key] || [])];
  return `<section class="feature ${f.cls}">
    <span class="feature-label">${esc(f.label)}</span>
    <div class="feature-name">${esc(name)}<span class="pr">${yen(item.price)}</span>　${tagBadges(tags)}</div>
    <div class="feature-desc">${esc(f.desc)}</div>
  </section>`;
}

function setBlock() {
  const s = MENU.setInfo;
  const opts = s.options.map((o) => {
    const m = o.match(/^(.*?セット)：(.*)$/);
    return m ? `<li><b>${esc(m[1])}</b>　${esc(m[2])}</li>` : `<li>${esc(o)}</li>`;
  }).join('');
  return `<section class="setbox">
    <div class="toku-circle">得</div>
    <div class="setbox-title">ラーメンセット</div>
    <div class="setbox-plus">お好きな麺類に プラス <b>350</b> 円</div>
    <ul>${opts}</ul>
    <div class="note">※Bセットは揚げ餃子は出来ません</div>
  </section>`;
}

function legendBlock(day) {
  const oomori = day === 'weekday' ? '麺類大盛り：平日は無料（土日祝＋200円）' : '麺類大盛り：土日祝＋200円（平日は無料）';
  return `<div class="legend">
    <div class="legend-title">マークのご案内</div>
    <div>${BADGE_IMG['特盛可']} … <b>特盛</b>にできます（別途追加料金）　${BADGE_IMG['持帰']} … <b>お持ち帰り</b>できます</div>
    <div><span class="badge badge-ninki">人気</span> <span class="badge badge-meibutsu">名物</span> … 当店のおすすめです</div>
    <div class="row-note">※${oomori}／ご飯類・スープ大盛り＋200円</div>
  </div>`;
}

function specialBlock(token, day) {
  if (token === '@set') return setBlock();
  if (token === '@oomori-men') {
    const t = day === 'weekday'
      ? '麺類 <span class="big">大盛り無料</span>！<small>（平日）土日祝は＋200円にて承ります</small>'
      : '麺類大盛り <span class="big">＋200円</span><small>平日は大盛り無料！</small>';
    return `<section class="banner-oomori">${t}</section>`;
  }
  if (token === '@oomori-gohan') {
    return `<section class="infobox">ご飯類・スープの大盛りは<b>＋200円</b>にて承ります。</section>`;
  }
  if (token === '@weekend-note') {
    return `<section class="infobox">${esc(MENU.days.weekend.note || '')}</section>`;
  }
  if (token.startsWith('@feature:')) return featureBlock(token.slice(9), day);
  return '';
}

function findItem(day, name) {
  for (const cat of MENU.days[day].categories) {
    const hit = cat.items.find((it) => it.name === name);
    if (hit) return hit;
  }
  return null;
}

function omitSetFor(page) {
  const omit = new Set();
  for (const col of page.cols) for (const token of col) {
    if (token.startsWith('@feature:')) {
      const key = token.slice(9);
      omit.add(key);
      (FEATURES[key]?.omitAlso || []).forEach((n) => omit.add(n));
    }
  }
  return omit;
}

function renderPage(page, qaMessages) {
  const dayLabel = MENU.days[page.day].label;
  const omit = omitSetFor(page);
  const catsByName = Object.fromEntries(MENU.days[page.day].categories.map((c) => [c.name, c]));

  const colsHtml = page.cols.map((col) => {
    const blocks = col.map((token) => {
      if (token.startsWith('@')) return specialBlock(token, page.day);
      const cat = catsByName[token];
      if (!cat) { qaMessages.push(`【${dayLabel}・${page.face}】カテゴリ「${token}」がmenu.jsonに見つかりません`); return ''; }
      return catBlock(cat, omit);
    }).join('');
    return `<div class="col">${blocks}</div>`;
  }).join('');

  return `<div class="page" data-label="${dayLabel}・${page.face}">
    <div class="page-inner">
      <div class="topband"></div>
      <div class="head">
        <div class="shop">
          <div class="shop-logo"><span class="shop-kicker">ラーメン・中華食堂</span><span class="shop-name">陽気軒</span></div>
        </div>
        <span class="face-title">${esc(page.face)}</span>
        <span class="day-tag">${esc(dayLabel)}</span>
        <div class="head-spacer"></div>
        ${legendBlock(page.day)}
      </div>
      <div class="cols">${colsHtml}</div>
      <div class="draft-note">叩き台 d-pop-chain（2026-09-09）／品目・価格は menu.json 2026-06版。持帰・特盛可マークの付与は仮サンプル（対象品はスプシ検討で確定）</div>
      <div class="foot">
        <span>陽気軒　営業時間：AM11:00〜PM8:00（ラストオーダー PM7:30）</span>
        <small>価格はすべて税込です。メニュー・価格は変更になる場合があります。</small>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   QAチェック：未配置カテゴリ・カラムあふれの検出
   ============================================================ */
function qaUnplacedCategories(qaMessages) {
  for (const dayKey of ['weekday', 'weekend']) {
    const placed = new Set();
    const featured = new Set();
    PAGES.filter((p) => p.day === dayKey).forEach((p) => p.cols.flat().forEach((t) => {
      if (t.startsWith('@feature:')) {
        const key = t.slice(9);
        featured.add(key);
        (FEATURES[key]?.omitAlso || []).forEach((n) => featured.add(n));
      } else if (!t.startsWith('@')) {
        placed.add(t);
      }
    }));
    for (const cat of MENU.days[dayKey].categories) {
      if (placed.has(cat.name)) continue;
      // 全品が特設枠（＋説明内掲載）でカバーされていれば配置済み扱い
      if (cat.items.every((it) => featured.has(it.name))) continue;
      qaMessages.push(`【${MENU.days[dayKey].label}】カテゴリ「${cat.name}」（${cat.items.length}品）がどの面にも配置されていません`);
    }
  }
}

function qaOverflow() {
  document.querySelectorAll('.page').forEach((pageEl) => {
    pageEl.querySelectorAll('.col').forEach((colEl, i) => {
      if (colEl.scrollHeight > colEl.clientHeight + 1) {
        const tag = document.createElement('div');
        tag.className = 'overflow-tag';
        tag.textContent = `あふれ：${colEl.scrollHeight - colEl.clientHeight}px`;
        colEl.appendChild(tag);
        console.error(`[overflow] ${pageEl.dataset.label} 第${i + 1}カラム`);
      }
    });
  });
}

const qaMessages = [];
qaUnplacedCategories(qaMessages);
const html = PAGES.map((p) => renderPage(p, qaMessages)).join('');
const banner = qaMessages.length
  ? `<div class="qa-banner">要修正：${qaMessages.map(esc).join('／')}</div>` : '';
document.getElementById('app').innerHTML = banner + html;
qaOverflow();
</script>
