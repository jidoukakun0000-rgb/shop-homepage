<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>陽気軒 メニュー表 A3（k1 朱一色刷り）</title>
<!--
  陽気軒 紙メニュー A3版下 ／ 案 k1「朱一色刷り」
  - A3横（420×297mm）× 表裏。表＝麺類の部、裏＝ご飯の部（平日・土日祝の計4面）
  - 使用インキは朱赤 #C4281A の1色のみ。濃度（ベタ／70／40／15／8％）と紙のクリーム地だけで階層をつくる。
    金・黒・青などの他色は一切使わない（本文も黒ではなく濃朱茶 #5A1E12）。
  - 版ズレ風のハードシャドウ以外、ぼかし影は使用しない（印刷適性のため）
  - 自動組版：カラムがあふれない範囲で本文級数・行間・ブロック間アキを最大化し、紙面下部の空きを潰す
  - あふれ検出：カラムが縦にあふれると赤い「あふれ」タグ。未配置カテゴリは上部に赤帯で警告
-->
<style>
  :root {
    /* ── 朱一色。すべてこの1色の濃度違い ───────────── */
    --shu:      #C4281A;   /* ベタ 100% */
    --shu85:    #CB4132;
    --shu70:    #CF5A4A;
    --shu55:    #DC8375;
    --shu40:    #E3A193;
    --shu25:    #EBC0B5;
    --shu15:    #F0D5C9;
    --shu10:    #F3DFD6;
    --shu08:    #F5E5DD;
    --shu05:    #F8EDE7;
    --ink:      #5A1E12;   /* 本文（濃い朱茶。黒は使わない） */
    --ink-mid:  #8E3D2A;
    --paper:    #F7F1E4;   /* 紙のクリーム地 */
    --paper-lt: #FDF9F0;   /* 抜き文字・枠内の明るい地 */

    /* 自動組版で上書きされる寸法（初期値＝最小値） */
    --fs-item: 16.3px;
    --fs-price: 17.3px;
    --pad-item: 3.8px;
    --fs-cat: 20px;
    --pad-cat: 5.7px;
    --gap-cat: 12.1px;
    --k: 1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #6f6f6f; }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @page { size: 420mm 297mm; margin: 0; }

  .page {
    position: relative;
    width: 420mm;
    height: 297mm;
    background: var(--paper);
    overflow: hidden;
    page-break-after: always;
    margin: 0 auto 10px;
  }
  @media print { .page { margin: 0; } }

  /* ── 罫：外太・内細の二重罫（一色刷りの締め） ───────── */
  .frame {
    position: absolute;
    inset: 7mm;
    border: 0.9mm solid var(--shu);
    pointer-events: none;
  }
  .frame::before {
    content: '';
    position: absolute;
    inset: 1.7mm;
    border: 0.28mm solid var(--shu55);
  }
  /* 四隅に小さな朱の角印（版画的なアクセント。全周には敷き詰めない） */
  .frame i {
    position: absolute;
    width: 4.4mm;
    height: 4.4mm;
    background: var(--shu);
  }
  .frame i:nth-child(1) { top: -0.9mm; left: -0.9mm; }
  .frame i:nth-child(2) { top: -0.9mm; right: -0.9mm; }
  .frame i:nth-child(3) { bottom: -0.9mm; right: -0.9mm; }
  .frame i:nth-child(4) { bottom: -0.9mm; left: -0.9mm; }

  .page-inner {
    position: absolute;
    inset: 14mm 15mm 12.5mm;
    display: flex;
    flex-direction: column;
  }

  /* ── ヘッダー ─────────────────────────── */
  .head {
    display: flex;
    align-items: center;
    gap: 7mm;
    padding-bottom: 3.4mm;
  }
  .shop { display: flex; align-items: center; gap: 4.6mm; }
  .mark-lg { width: 26mm; height: 26mm; flex: none; display: block; }
  .mark-sm { width: 7.4mm; height: 7.4mm; flex: none; display: block; }
  .shop-text { display: flex; flex-direction: column; }
  .shop-name {
    font-size: 50pt;
    font-weight: 600;
    letter-spacing: 0.1em;
    line-height: 1;
    color: var(--shu);
    white-space: nowrap;
  }
  .shop-tagline {
    font-size: 10.5pt;
    font-weight: 600;
    letter-spacing: 0.46em;
    color: var(--ink-mid);
    white-space: nowrap;
    margin-top: 2.2mm;
    padding-left: 0.4mm;
  }
  .shop-tagline i { font-style: normal; color: var(--shu40); }

  .face-title {
    background: var(--shu);
    color: var(--paper-lt);
    font-size: 25pt;
    font-weight: 600;
    letter-spacing: 0.42em;
    line-height: 1;
    padding: 4.2mm 5.2mm 4.2mm 9.4mm;
    white-space: nowrap;
  }
  .day-tag {
    font-size: 15pt;
    font-weight: 600;
    letter-spacing: 0.3em;
    line-height: 1;
    color: var(--shu);
    border: 0.55mm solid var(--shu);
    padding: 3.7mm 3mm 3.7mm 5.4mm;
    white-space: nowrap;
    background: var(--paper-lt);
  }
  .head-title { display: flex; align-items: stretch; }
  .head-spacer { flex: 1; }

  /* ── 凡例（各ページ右上） ─────────────────── */
  .legend {
    border: 0.32mm solid var(--shu40);
    background: var(--shu05);
    padding: 2.4mm 4mm 2.6mm;
    font-size: 9pt;
    font-weight: 600;
    line-height: 1.6;
    max-width: 152mm;
  }
  .legend-title {
    font-size: 9pt;
    font-weight: 600;
    letter-spacing: 0.34em;
    color: var(--shu);
    border-bottom: 0.28mm solid var(--shu40);
    padding-bottom: 0.9mm;
    margin-bottom: 1.2mm;
  }
  .legend b { color: var(--shu); font-weight: 600; }
  .legend .row-note { color: var(--ink-mid); font-size: 8.5pt; }
  .legend .sep { display: inline-block; width: 5mm; }

  /* ── 雷文の帯（全周には回さず、ヘッダー下の一本だけ） ─── */
  .raimon-band {
    height: 4.6mm;
    flex: none;
    background:
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2234%22%20height%3D%2232%22%20viewBox%3D%220%200%2034%2032%22%3E%3Crect%20width%3D%2234%22%20height%3D%2232%22%20fill%3D%22%23C4281A%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23F7F1E4%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22butt%22%20stroke-linejoin%3D%22miter%22%3E%3Cpath%20d%3D%22M0%2016%20H4%22%2F%3E%3Cpath%20d%3D%22M30%2016%20H34%22%2F%3E%3Crect%20x%3D%224.5%22%20y%3D%224.5%22%20width%3D%2225%22%20height%3D%2223%22%2F%3E%3Crect%20x%3D%2212%22%20y%3D%2212%22%20width%3D%2210%22%20height%3D%228%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E")
      repeat-x 0 0 / auto 100%;
    margin-bottom: 5mm;
  }

  /* ── バッジ「特」「持」（5mm角以上・朱一色） ────────── */
  .kbadge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 5.4mm;
    height: 5.4mm;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 10.5pt;
    font-weight: 700;
    line-height: 1;
    vertical-align: -1.3mm;
    flex: none;
  }
  .kbadge-toku { background: var(--shu); color: var(--paper-lt); }
  .kbadge-mochi { background: var(--paper-lt); color: var(--shu); box-shadow: inset 0 0 0 0.45mm var(--shu); }
  .legend .kbadge { width: 6.4mm; height: 6.4mm; font-size: 12.5pt; vertical-align: -1.9mm; }

  /* ── 本体：4カラム ───────────────────── */
  .cols {
    flex: 1;
    display: flex;
    gap: 6mm;
    min-height: 0;
  }
  .col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    row-gap: var(--gap-cat);
    overflow: hidden;
    position: relative;
  }

  /* ── カテゴリ：濃度だけで階層をつくる ───────────── */
  .cat { break-inside: avoid; border: 0.3mm solid var(--shu40); }
  .cat-head {
    font-size: var(--fs-cat);
    font-weight: 600;
    letter-spacing: 0.2em;
    padding: var(--pad-cat) 3.4mm var(--pad-cat) 3.2mm;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 3mm;
    line-height: 1.25;
  }
  .cat-head::before {
    content: '';
    flex: none;
    align-self: center;
    width: 1.9mm;
    height: 1.9mm;
    transform: rotate(45deg);
    margin-right: 0.6mm;
  }
  .cat-head .cat-nm { white-space: nowrap; }
  .cat-head small {
    font-size: 8.8pt;
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1.4;
  }
  /* 濃度3段：ベタ／70％／40％ */
  .d1 .cat-head { background: var(--shu);   color: var(--paper-lt); }
  .d1 .cat-head::before { background: var(--paper-lt); }
  .d1 .cat-head small { color: var(--shu25); }
  .d2 .cat-head { background: var(--shu70); color: var(--paper-lt); }
  .d2 .cat-head::before { background: var(--paper-lt); }
  .d2 .cat-head small { color: var(--shu15); }
  .d3 .cat-head { background: var(--shu40); color: var(--ink); border-bottom: 0.3mm solid var(--shu55); }
  .d3 .cat-head::before { background: var(--shu); }
  .d3 .cat-head small { color: var(--ink-mid); }

  .cat-body {
    background: var(--shu08);
    padding: 1.8mm 3mm 2.2mm;
  }
  .item {
    display: flex;
    align-items: baseline;
    gap: 1.3mm;
    padding: var(--pad-item) 0;
    line-height: 1.3;
  }
  .item + .item { border-top: 0.22mm solid var(--shu25); }
  /* 品名は左寄せ・素直な字間（均等割り付けは判読性を損なうため不採用） */
  .item .nm {
    font-size: var(--fs-item);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.005em;
    color: var(--ink);
  }
  .item .nm .paren { font-size: 0.68em; }
  .item .dots {
    flex: 1;
    border-bottom: 0.28mm dotted var(--shu40);
    transform: translateY(-1.1mm);
    min-width: 2.2mm;
  }
  .item .pr {
    font-size: var(--fs-price);
    font-weight: 600;
    color: var(--shu);
    white-space: nowrap;
    font-feature-settings: "tnum";
    min-width: 12.8mm;
    text-align: right;
    letter-spacing: 0.01em;
  }
  .item .pr small { font-size: 0.62em; font-weight: 600; color: var(--ink-mid); margin-left: 0.3mm; }

  /* ── 看板商品：ここだけ朱ベタで強く ───────────── */
  .feature {
    position: relative;
    background: var(--shu);
    color: var(--paper-lt);
    padding: calc(4mm * var(--ky, var(--k))) 4.4mm calc(4mm * var(--ky, var(--k)));
    break-inside: avoid;
    box-shadow: 1.3mm 1.3mm 0 var(--shu15);
  }
  .feature-label {
    display: inline-block;
    background: var(--paper-lt);
    color: var(--shu);
    font-size: calc(9.5pt * var(--k));
    font-weight: 600;
    letter-spacing: 0.28em;
    padding: 1.2mm 2mm 1.2mm 3mm;
    margin-bottom: 2.2mm;
    line-height: 1;
  }
  .feature-name {
    font-size: calc(17.5pt * var(--k));
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1.25;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0 2.6mm;
  }
  .feature-name .pr { font-size: calc(23pt * var(--k)); letter-spacing: 0.01em; }
  .feature-name .pr small { font-size: 0.5em; }
  .feature-desc {
    font-size: calc(9.2pt * var(--k));
    font-weight: 600;
    margin-top: calc(2.2mm * var(--ky, var(--k)));
    padding-top: calc(2.2mm * var(--ky, var(--k)));
    border-top: 0.28mm solid var(--shu55);
    line-height: 1.6;
    color: var(--shu15);
    word-break: auto-phrase;
  }
  .feature .kbadge-toku { background: var(--paper-lt); color: var(--shu); }
  .feature .kbadge-mochi { background: transparent; color: var(--paper-lt); box-shadow: inset 0 0 0 0.45mm var(--paper-lt); }

  /* ── セット枠 ─────────────────────────── */
  .setbox {
    border: 0.7mm solid var(--shu);
    background: var(--paper-lt);
    padding: calc(4mm * var(--ky, var(--k))) 4mm calc(3.8mm * var(--ky, var(--k)));
    break-inside: avoid;
    box-shadow: 1.3mm 1.3mm 0 var(--shu15);
  }
  .toku-circle {
    flex: none;
    width: 8.6mm;
    height: 8.6mm;
    border-radius: 50%;
    background: var(--paper-lt);
    color: var(--shu);
    font-size: calc(11pt * var(--k));
    font-weight: 600;
    letter-spacing: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .setbox-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3.2mm;
    font-size: calc(16pt * var(--k));
    font-weight: 600;
    letter-spacing: 0.3em;
    color: var(--paper-lt);
    background: var(--shu);
    padding: calc(2mm * var(--ky, var(--k))) 2.5mm;
    line-height: 1.2;
    white-space: nowrap;
  }
  .setbox-title .ttl { padding-left: 0.3em; }
  .setbox-plus {
    white-space: nowrap;
    text-align: center;
    font-size: calc(12pt * var(--k));
    font-weight: 600;
    margin: calc(2.8mm * var(--ky, var(--k))) 0 calc(2.6mm * var(--ky, var(--k)));
    letter-spacing: 0.04em;
  }
  .setbox-plus b { font-size: calc(25pt * var(--k)); color: var(--shu); font-weight: 600; margin: 0 0.8mm; }
  .setbox ul { list-style: none; font-size: calc(11pt * var(--k)); font-weight: 600; }
  .setbox ul li {
    display: flex;
    gap: 3mm;
    padding: calc(1.5mm * var(--ky, var(--k))) 1mm;
    border-top: 0.25mm solid var(--shu25);
  }
  .setbox ul li b { color: var(--shu); font-weight: 600; flex: none; letter-spacing: 0.06em; }
  .setbox .note { font-size: 8.4pt; margin-top: 2mm; color: var(--ink-mid); border-top: 0.25mm solid var(--shu25); padding-top: 1.6mm; }

  /* ── お知らせ枠・大盛り訴求 ────────────────── */
  .infobox {
    border: 0.32mm solid var(--shu40);
    background: var(--shu05);
    padding: calc(3mm * var(--ky, var(--k))) 3.6mm;
    font-size: calc(10pt * var(--k));
    font-weight: 600;
    line-height: 1.7;
  }
  .infobox b { color: var(--shu); font-weight: 600; }
  .banner-oomori {
    background: var(--shu);
    color: var(--paper-lt);
    text-align: center;
    font-size: calc(14pt * var(--k));
    font-weight: 600;
    letter-spacing: 0.14em;
    padding: calc(3.4mm * var(--ky, var(--k))) 3mm;
    line-height: 1.5;
    box-shadow: 1.3mm 1.3mm 0 var(--shu15);
  }
  .banner-oomori .big {
    display: block;
    white-space: nowrap;
    font-size: calc(22pt * var(--k));
    letter-spacing: 0.16em;
    margin: 0.8mm 0 0.4mm;
  }
  .banner-oomori small {
    display: block;
    font-size: calc(9pt * var(--k));
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--shu15);
    margin-top: 1mm;
    padding-top: 1.4mm;
    border-top: 0.28mm solid var(--shu55);
  }

  /* ── フッター ─────────────────────────── */
  .foot {
    margin-top: 4.5mm;
    flex: none;
    background: var(--shu);
    color: var(--paper-lt);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5mm 4.5mm 1.5mm 3mm;
    font-size: 10.5pt;
    font-weight: 600;
    letter-spacing: 0.2em;
  }
  .foot-brand { display: flex; align-items: center; gap: 2.8mm; }
  .foot small { font-weight: 600; font-size: 9pt; letter-spacing: 0.06em; color: var(--shu15); }

  /* ── QA表示（版下には出ない想定・検版用） ────────── */
  .overflow-tag {
    position: absolute;
    top: 0; right: 0;
    background: #D40000;
    color: #fff;
    font-size: 9pt;
    font-weight: 700;
    padding: 1mm 2.5mm;
    z-index: 10;
  }
  .qa-banner {
    background: #D40000;
    color: #fff;
    font-size: 10pt;
    font-weight: 700;
    padding: 2mm 4mm;
    margin-bottom: 2mm;
  }
</style>
</head>

   ============================================================ */
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const yen = (p) => `${p.toLocaleString()}<small>円</small>`;

function nameHtml(name) {
  return esc(name).replace(/（([^）]*)）/g, '<span class="paren">（$1）</span>');
}

const BADGE_IMG = {
  '持帰': '<span class="kbadge kbadge-mochi">持</span>',
  '特盛可': '<span class="kbadge kbadge-toku">特</span>',
};

function tagBadges(tags) {
  if (!tags || !tags.length) return '';
  const map = {
    '特盛可': BADGE_IMG['特盛可'],
    '持ち帰り可': BADGE_IMG['持帰'],
    '持帰': BADGE_IMG['持帰'],
  };
  const order = ['名物', '人気', '特盛可', '持ち帰り可', '持帰'];
  return [...tags].sort((a, b) => order.indexOf(a) - order.indexOf(b)).map((t) => map[t] || '').join('');
}

function itemRow(it) {
  const tags = [...(it.tags || []), ...(SAMPLE_TAGS[it.name] || [])];
  return `<div class="item"><span class="nm">${nameHtml(it.name)}</span>${tagBadges(tags)}<span class="dots"></span><span class="pr">${yen(it.price)}</span></div>`;
}

function catBlock(cat, omit) {
  const items = cat.items.filter((it) => !omit.has(it.name));
  if (!items.length) return '';
  const note = cat.note ? `<small>${esc(cat.note)}</small>` : '';
  return `<section class="cat ${bandOf(cat.name)}">
    <div class="cat-head"><span class="cat-nm">${esc(catDisplayName(cat.name))}</span>${note}</div>
    <div class="cat-body">${items.map(itemRow).join('')}</div>
  </section>`;
}

function featureBlock(key, day) {
  const f = FEATURES[key];
  const item = findItem(day, key);
  if (!item) return '';
  const name = f.rename || item.name;
  const tags = [...(SAMPLE_TAGS[key] || [])];
  const labelHtml = f.label ? `<span class="feature-label">${esc(f.label)}</span>` : '';
  return `<section class="feature">
    ${labelHtml}
    <div class="feature-name"><span>${esc(name)}</span><span class="pr">${yen(item.price)}</span>${tagBadges(tags)}</div>
    <div class="feature-desc">${esc(f.desc)}</div>
  </section>`;
}

function setBlock() {
  const s = MENU.setInfo;
  const opts = s.options.map((o) => {
    const m = o.match(/^(.*?セット)：(.*)$/);
    return m ? `<li><b>${esc(m[1])}</b><span>${esc(m[2])}</span></li>` : `<li>${esc(o)}</li>`;
  }).join('');
  return `<section class="setbox">
    <div class="setbox-title"><span class="toku-circle">得</span><span class="ttl">ラーメンセット</span></div>
    <div class="setbox-plus">お好きな麺類に プラス<b>350</b>円</div>
    <ul>${opts}</ul>
    <div class="note">※Bセットは揚げ餃子は出来ません</div>
  </section>`;
}

function legendBlock(day) {
  const oomori = day === 'weekday' ? '麺類大盛り：平日は無料（土日祝＋200円）' : '麺類大盛り：土日祝＋200円（平日は無料）';
  return `<div class="legend">
    <div class="legend-title">マークのご案内</div>
    <div>${BADGE_IMG['特盛可']} … <b>特盛</b>にできます（別途追加料金）<span class="sep"></span>${BADGE_IMG['持帰']} … <b>お持ち帰り</b>できます</div>
    <div class="row-note">※${oomori}／ご飯類・スープ大盛り＋200円</div>
  </div>`;
}

function specialBlock(token, day) {
  if (token === '@set') return setBlock();
  if (token === '@oomori-men') {
    const t = day === 'weekday'
      ? '麺類<span class="big">大盛り無料</span><small>平日のみ／土日祝は＋200円にて承ります</small>'
      : '麺類大盛り<span class="big">＋200円</span><small>平日は大盛り無料にて承ります</small>';
    return `<section class="banner-oomori">${t}</section>`;
  }
  if (token === '@oomori-gohan') {
    return `<section class="infobox">ご飯類・スープの大盛りは<b>＋200円</b>にて承ります。</section>`;
  }
  if (token === '@weekend-note') {
    return `<section class="infobox">${esc(MENU.days.weekend.note || '')}</section>`;
  }
  if (token.startsWith('@feature:')) return featureBlock(token.slice(9), day);
  return '';
}

function findItem(day, name) {
  for (const cat of MENU.days[day].categories) {
    const hit = cat.items.find((it) => it.name === name);
    if (hit) return hit;
  }
  return null;
}

function omitSetFor(page) {
  const omit = new Set();
  for (const col of page.cols) for (const token of col) {
    if (token.startsWith('@feature:')) {
      const key = token.slice(9);
      omit.add(key);
      (FEATURES[key]?.omitAlso || []).forEach((n) => omit.add(n));
    }
  }
  return omit;
}

function renderPage(page, qaMessages) {
  const dayLabel = MENU.days[page.day].label;
  const omit = omitSetFor(page);
  const catsByName = Object.fromEntries(MENU.days[page.day].categories.map((c) => [c.name, c]));

  const colsHtml = page.cols.map((col) => {
    const blocks = col.map((token) => {
      if (token.startsWith('@')) return specialBlock(token, page.day);
      const cat = catsByName[token];
      if (!cat) { qaMessages.push(`【${dayLabel}・${page.face}】カテゴリ「${token}」がmenu.jsonに見つかりません`); return ''; }
      return catBlock(cat, omit);
    }).join('');
    return `<div class="col">${blocks}</div>`;
  }).join('');

  return `<div class="page" data-label="${dayLabel}・${page.face}">
    <div class="frame"><i></i><i></i><i></i><i></i></div>
    <div class="page-inner">
      <div class="head">
        <div class="shop">
          ${ramenMarkLarge()}
          <div class="shop-text">
            <span class="shop-name">陽気軒</span>
            <span class="shop-tagline">ラーメン<i>・</i>中華食堂</span>
          </div>
        </div>
        <div class="head-title">
          <span class="face-title">${esc(page.face)}</span>
          <span class="day-tag">${esc(dayLabel)}</span>
        </div>
        <div class="head-spacer"></div>
        ${legendBlock(page.day)}
      </div>
      <div class="raimon-band"></div>
      <div class="cols">${colsHtml}</div>
      <div class="foot">
        <span class="foot-brand">${ramenMarkSmall()}<span>陽気軒</span></span>
        <small>価格はすべて税込です。メニュー・価格は変更になる場合があります。</small>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   自動組版：紙面下部の空きを潰す
   カラムがあふれない範囲で本文級数・行間・ブロック間アキを最大化し、
   最後に残ったアキをブロック間へ均等配分して天地を使い切る
   ============================================================ */
const PT = 96 / 72;
const MM = 96 / 25.4;

function fitStep(t) {
  return {
    '--fs-item':  (12.2 + 5.0 * t) * PT,
    '--fs-price': (13.0 + 5.4 * t) * PT,
    '--pad-item': (0.95 + 2.25 * t) * MM,
    '--fs-cat':   (15.0 + 5.5 * t) * PT,
    '--pad-cat':  (1.5 + 1.5 * t) * MM,
    '--gap-cat':  (3.2 + 3.8 * t) * MM,
    '--k':        1 + 0.6 * t,
  };
}

function applyStep(pageEl, s) {
  for (const k in s) pageEl.style.setProperty(k, k === '--k' ? String(s[k]) : s[k] + 'px');
}

function colsFit(cols) {
  return cols.every((c) => c.scrollHeight <= c.clientHeight + 0.5);
}

/* 各カテゴリでいちばん長い品名。級数を上げすぎて長い行だけ極端に小さくなるのを防ぐ見張り役 */
function longestNames(pageEl) {
  const list = [];
  pageEl.querySelectorAll('.cat-body').forEach((body) => {
    let worst = null;
    let len = 0;
    body.querySelectorAll('.item .nm').forEach((nm) => {
      const n = nm.textContent.length;
      if (n > len) { len = n; worst = nm; }
    });
    if (worst) list.push(worst);
  });
  return list;
}
const NAME_MIN_RATIO = 0.8;  /* 長い品名でも本文級数の8割は保つ */
function namesFit(list) {
  return list.every((nm) => nm.clientWidth >= nm.scrollWidth * NAME_MIN_RATIO - 0.5);
}

function autoFit() {
  const STEPS = 40;
  document.querySelectorAll('.page').forEach((pageEl) => {
    const cols = [...pageEl.querySelectorAll('.col')];

    /* 1) 面全体：どの段もあふれない範囲で級数・行間・アキを最大化 */
    const longs = longestNames(pageEl);
    let best = 0;
    for (let i = 0; i <= STEPS; i++) {
      applyStep(pageEl, fitStep(i / STEPS));
      if (colsFit(cols) && namesFit(longs)) best = i; else break;
    }
    applyStep(pageEl, fitStep(best / STEPS));

    const cs = getComputedStyle(pageEl);
    const basePad = parseFloat(cs.getPropertyValue('--pad-item')) || 0;
    const baseGap = parseFloat(cs.getPropertyValue('--gap-cat')) || 0;
    const pageK = parseFloat(pageEl.style.getPropertyValue('--k')) || 1;
    const fitsH = (c) => c.scrollHeight <= c.clientHeight + 0.5;
    /* 折り返さない大きな文字（セット枠・大盛り帯）が枠の内アキを食い潰さないか見る */
    const fitsW = (c) => c.scrollWidth <= c.clientWidth + 0.5
      && [...c.querySelectorAll('.setbox-title, .setbox-plus, .banner-oomori .big')]
           .every((e) => e.scrollWidth <= e.clientWidth - 2);

    cols.forEach((c) => {
      const kids = [...c.children];
      const n = kids.length;
      if (!n) return;
      const rows = c.querySelectorAll('.item').length;

      /* 2) 特設枠だけの段は、枠の級数と天地の内アキを先に育てる（横幅の見張り付き） */
      const growKy = (from, limit) => {
        let by = from;
        for (let y = from; y <= limit; y += 0.04) {
          c.style.setProperty('--ky', String(y));
          if (fitsH(c)) by = y; else break;
        }
        c.style.setProperty('--ky', String(by));
      };
      if (!c.querySelector('.cat')) {
        let bk = pageK;
        for (let k = pageK; k <= 1.9; k += 0.02) {
          c.style.setProperty('--k', String(k));
          if (fitsH(c) && fitsW(c)) bk = k; else break;
        }
        c.style.setProperty('--k', String(bk));
        growKy(bk, 3.2);
      }

      /* 3) 残りを行アキ（各品の上下）とブロック間アキへ配分 */
      const last = () => { const k = c.children[c.children.length - 1]; return k.offsetTop + k.offsetHeight; };
      let slack = c.clientHeight - last() - 2;
      if (slack > 0) {
        const rowCap = rows * 4.0 * MM;
        const gapCap = Math.max(0, n - 1) * 20 * MM;
        const cap = rowCap + gapCap;
        if (cap > 0) {
          const use = Math.min(slack, cap);
          const rowPart = use * (rowCap / cap);
          const gapPart = use - rowPart;
          if (rows > 0 && rowPart > 0) c.style.setProperty('--pad-item', (basePad + rowPart / rows / 2) + 'px');
          if (n > 1 && gapPart > 0) c.style.rowGap = (baseGap + gapPart / (n - 1)) + 'px';
        }
      }

      /* 4) なお余るときは、特設枠の天地内アキを伸ばして紙面を使い切る */
      if (c.clientHeight - last() > 4 && c.querySelector('.feature, .setbox, .banner-oomori, .infobox')) {
        growKy(parseFloat(c.style.getPropertyValue('--ky')) || parseFloat(c.style.getPropertyValue('--k')) || pageK, 4.2);
      }
    });
  });
}

/* 品名が枠に収まらない場合だけ、その行の級数を落とす（下限12pt厳守） */
function fitNames() {
  const MIN = 12 * PT;
  document.querySelectorAll('.item').forEach((it) => {
    const nm = it.querySelector('.nm');
    if (!nm) return;
    const base = parseFloat(getComputedStyle(nm).fontSize);
    let fs = base;
    let guard = 0;
    while (nm.scrollWidth > nm.clientWidth + 0.5 && fs > MIN && guard++ < 60) {
      fs = Math.max(MIN, fs - 0.4);
      nm.style.fontSize = fs + 'px';
    }
    /* 印刷時のわずかな組み幅の差で三点リーダに化けないよう、詰めた行だけ余裕を持たせる */
    if (fs < base - 0.01) {
      fs = Math.max(MIN, fs - 0.8);
      nm.style.fontSize = fs + 'px';
    }
  });
}

/* ============================================================
   QAチェック：未配置カテゴリ・カラムあふれの検出
   ============================================================ */
function qaUnplacedCategories(qaMessages) {
  for (const dayKey of ['weekday', 'weekend']) {
    const placed = new Set();
    const featured = new Set();
    PAGES.filter((p) => p.day === dayKey).forEach((p) => p.cols.flat().forEach((t) => {
      if (t.startsWith('@feature:')) {
        const key = t.slice(9);
        featured.add(key);
        (FEATURES[key]?.omitAlso || []).forEach((n) => featured.add(n));
      } else if (!t.startsWith('@')) {
        placed.add(t);
      }
    }));
    for (const cat of MENU.days[dayKey].categories) {
      if (placed.has(cat.name)) continue;
      if (cat.items.every((it) => featured.has(it.name))) continue;
      qaMessages.push(`【${MENU.days[dayKey].label}】カテゴリ「${cat.name}」（${cat.items.length}品）がどの面にも配置されていません`);
    }
  }
}

function qaOverflow() {
  document.querySelectorAll('.page').forEach((pageEl) => {
    pageEl.querySelectorAll('.col').forEach((colEl, i) => {
      if (colEl.scrollHeight > colEl.clientHeight + 1) {
        const tag = document.createElement('div');
        tag.className = 'overflow-tag';
        tag.textContent = `あふれ：${colEl.scrollHeight - colEl.clientHeight}px`;
        colEl.appendChild(tag);
        console.error(`[overflow] ${pageEl.dataset.label} 第${i + 1}カラム`);
      }
    });
  });
}

const qaMessages = [];
qaUnplacedCategories(qaMessages);
const html = PAGES.map((p) => renderPage(p, qaMessages)).join('');
const banner = qaMessages.length
  ? `<div class="qa-banner">要修正：${qaMessages.map(esc).join('／')}</div>` : '';
document.getElementById('app').innerHTML = banner + html;
autoFit();
fitNames();
qaOverflow();
</script>
</body>
</html>
